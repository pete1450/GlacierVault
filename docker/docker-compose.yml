services:
  glaciervault:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: glaciervault:latest
    container_name: glaciervault
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistent data — survive container restarts/upgrades.
      - glaciervault-config:/config
      - glaciervault-database:/database
      - glaciervault-cache:/cache
      - glaciervault-logs:/logs
      - /home/dev/backuptest:/backuptest
      # ── Backup source mounts ──────────────────────────────────────────────
      # Add your host paths below. The container paths must match what you
      # configure in GlacierVault's UI as source paths.
      #
      # Example:
      #   - /home:/mnt/home:ro
      #   - /srv/media:/mnt/media:ro
      #   - /var/lib/docker/volumes:/mnt/docker-volumes:ro
    environment:
      # ── Authentication ──────────────────────────────────────────────────
      # AUTH_TYPE: "password" (default) or "oidc" for SSO.
      - AUTH_TYPE=${AUTH_TYPE:-password}
      # Set your initial login password here (or change it after first boot).
      # Only used when AUTH_TYPE=password.
      - INITIAL_PASSWORD=changeme
      # OIDC/SSO settings (only used when AUTH_TYPE=oidc).
      # Example for Authentik: https://auth.example.com/application/o/glaciervault/
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-http://localhost:8080/api/auth/oidc/callback}
      # ── End Authentication ──────────────────────────────────────────────
      # Timezone that backup schedules (cron expressions) evaluate in.
      # Use an IANA name, e.g. America/Chicago, Europe/Berlin.
      # Without this the container runs on UTC.
      - TZ=${TZ:-UTC}
      # Optional: override config/database locations.
      # - CONFIG_DIR=/config
      # - DATABASE_PATH=/database/glaciervault.db
      # - LISTEN_ADDR=:8080

volumes:
  glaciervault-config:
  glaciervault-database:
  glaciervault-cache:
  glaciervault-logs:
